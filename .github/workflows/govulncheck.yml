name: govulncheck

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    # Weekly on Monday morning (UTC) so new vulnerabilities are caught
    # even when there is no PR/push activity.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        # Pinned to a commit hash rather than @latest, which can break the
        # job (or change behavior) without any change in this repository.
        # The vulnerability database is fetched at run time, so pinning the
        # tool does not make the findings stale.
        run: go install golang.org/x/vuln/cmd/govulncheck@e672cbe8fbc8c76e28fcb6db0efd9ce354e0dac5 # v1.9.0
      - name: Run govulncheck and fail on non-allowlisted findings
        # govulncheck has no built-in per-finding suppression, so this step
        # runs it in -json mode and compares the OSV IDs that actually affect
        # this module against an explicit allowlist. Any finding outside the
        # allowlist fails the job, so newly published vulnerabilities are
        # caught immediately.
        #
        # "Affect" follows govulncheck's own criterion: only symbol-level
        # findings count, i.e. the code reaches a vulnerable function. This
        # is what makes plain `govulncheck ./...` exit non-zero. Findings
        # where a vulnerable module is merely required, or a package is
        # imported without calling the vulnerable symbol, are listed in the
        # log for reference but do not fail the job.
        #
        # Allowlisted findings (as of 2026-11): 2 vulnerabilities from
        # github.com/docker/docker@v28.5.2+incompatible. Both are daemon-side
        # issues with "Fixed in: N/A" because the moby v29 module split means
        # no fixed version exists on the old module path. Remove these entries
        # once containers/image and this repository migrate to the moby v29
        # module split.
        env:
          # Match the test workflow: with cgo enabled, loading the
          # containers/storage btrfs driver fails on runners without the
          # btrfs headers installed.
          CGO_ENABLED: "0"
        run: |
          printf '%s\n' \
            GO-2026-4883 \
            GO-2026-4887 \
            | sort > allowlist.txt

          # -json mode exits 0 even when findings exist, so a non-zero exit
          # here means govulncheck itself failed.
          govulncheck -json ./... > govulncheck.json

          # Symbol-level findings: the first trace frame names the vulnerable
          # function that is reachable from this module.
          jq -r 'select(.finding != null and .finding.trace[0].function != null) | .finding.osv' govulncheck.json \
            | sort -u > found.txt

          # Module- or package-level only: informational.
          jq -r 'select(.finding != null) | .finding.osv' govulncheck.json \
            | sort -u | comm -23 - found.txt > unreached.txt

          echo "Vulnerabilities affecting this module (vulnerable symbol is reachable):"
          cat found.txt
          echo "Vulnerabilities in dependencies whose vulnerable symbol is not reached (informational):"
          cat unreached.txt

          stale=$(comm -13 found.txt allowlist.txt)
          if [ -n "$stale" ]; then
            echo "::warning::Allowlisted vulnerabilities no longer reported (remove from allowlist): ${stale//$'\n'/, }"
          fi

          new=$(comm -23 found.txt allowlist.txt)
          if [ -n "$new" ]; then
            echo "::error::New vulnerabilities not in the allowlist: ${new//$'\n'/, }"
            echo "Details: https://pkg.go.dev/vuln/<ID> — or run 'govulncheck ./...' locally."
            exit 1
          fi
          echo "OK: only allowlisted findings are present."
